name: הוספת סקיל / Submit a skill
description: הצעת סקיל לאינדקס, כולל סקילים שלא נמצאים בגיטהאב
title: "[skill] "
labels: ["skill-submission"]
body:
  - type: markdown
    attributes:
      value: |
        אחרי שמנהל הריפו יאשר את ההגשה (בתווית `approved`), הסקיל ייכנס לאתר אוטומטית.
        After a maintainer adds the `approved` label, the skill is added automatically.
  - type: input
    id: url
    attributes:
      label: קישור / URL
      description: קישור לתיקיית הסקיל בגיטהאב, או קישור ישיר לקובץ SKILL.md, או לעמוד של הסקיל באתר אחר.
      placeholder: https://github.com/owner/repo/tree/main/skills/my-skill
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: שם הסקיל / Name
      description: לא חובה אם יש בקישור קובץ SKILL.md
  - type: textarea
    id: description
    attributes:
      label: תיאור / Description
      description: מה הסקיל עושה ומתי משתמשים בו. לא חובה אם יש SKILL.md
  - type: input
    id: tags
    attributes:
      label: מילות מפתח / Tags
      description: מופרדות בפסיקים, למשל pdf, research, hebrew
