name: Update skills & deploy site

on:
  schedule:
    - cron: '17 3 * * *'   # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      collect:
        description: 'Collect skills from GitHub (spends the hourly API budget)'
        type: boolean
        default: true
      translate:
        description: 'Translate new descriptions to Hebrew'
        type: boolean
        default: true
  push:
    paths: ['site/**', 'scripts/**', 'config/**', 'data/submissions.json', '.github/workflows/update.yml']

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  collect:
    # Pages deploys only from the default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure submission labels exist
        uses: actions/github-script@v7
        with:
          script: |
            for (const [name, color] of [['skill-submission', 'c2552c'], ['approved', '2f7a4b']]) {
              try { await github.rest.issues.getLabel({ ...context.repo, name }); }
              catch { await github.rest.issues.createLabel({ ...context.repo, name, color }); }
            }

      # Code pushes only redeploy the site; collecting spends the hourly API budget, so it runs
      # on the daily schedule and on manual dispatch.
      - name: Collect skills
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect.mjs

      # Hebrew translation with open MT models on the runner's CPU (no API, no cost).
      # Time-boxed: whatever doesn't fit is translated on the next run.
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.translate)
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-translate.txt

      - name: Cache translation models
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.translate)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opus-mt-en-he-mul-en-v1

      - name: Translate descriptions to Hebrew
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.translate)
        run: |
          pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r scripts/requirements-translate.txt
          python scripts/translate.py --max-minutes 45

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "skills-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Build the commit on top of the branch as it is *now* (other runs, code pushes or
          # accepted submissions may have landed meanwhile) and stage only files this run produced,
          # so fresh data wins without reverting anything else. Retry if the branch moves again.
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git fetch -q origin "$BRANCH"
            git reset -q FETCH_HEAD
            git add -A -- site/data data ':!data/submissions.json'
            if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
            git commit -qm "data: daily skills update $(date -u +%F)"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "Push rejected (branch moved), retrying"; sleep $((attempt * 5))
          done
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
