name: Update skills & deploy site

on:
  schedule:
    - cron: '17 3 * * *'   # daily, 03:17 UTC
  workflow_dispatch:
  push:
    paths: ['site/**', 'scripts/**', 'config/**', 'data/submissions.json', '.github/workflows/update.yml']

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  collect:
    # Pages deploys only from the default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure submission labels exist
        uses: actions/github-script@v7
        with:
          script: |
            for (const [name, color] of [['skill-submission', 'c2552c'], ['approved', '2f7a4b']]) {
              try { await github.rest.issues.getLabel({ ...context.repo, name }); }
              catch { await github.rest.issues.createLabel({ ...context.repo, name, color }); }
            }

      - name: Collect skills
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect.mjs

      - name: Commit updated data
        run: |
          git config user.name "skills-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily skills update $(date -u +%F)"
            git pull --rebase --autostash || true
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
