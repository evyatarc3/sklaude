<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>רדאר סקילים</title>
  <meta name="description" content="אינדקס סקילים ל-Claude שמתעדכן כל יום: סקילים חמים, לפי נושא, וחיפוש חופשי.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='none' stroke='%23d9643a' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%23d9643a'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <h1>רדאר סקילים</h1>
        <p class="sub" id="sub">טוען…</p>
      </div>
      <a class="btn ghost" id="submit-link" href="#" target="_blank" rel="noopener">+ הוספת סקיל</a>
    </div>
  </header>

  <main class="wrap">
    <div class="searchbar">
      <input id="q" type="search" placeholder="חיפוש חופשי: pdf, מצגת, code review, מחקר…" autocomplete="off" aria-label="חיפוש">
    </div>

    <nav class="tabs" role="tablist">
      <button role="tab" data-view="hot" aria-selected="true">🔥 חמים</button>
      <button role="tab" data-view="new" aria-selected="false">✨ חדשים</button>
      <button role="tab" data-view="top" aria-selected="false">⭐ פופולריים</button>
      <button role="tab" data-view="buzz" aria-selected="false">💬 מדברים על זה</button>
    </nav>

    <div class="chips" id="cats" aria-label="נושאים"></div>

    <div class="filters">
      <label><input type="checkbox" id="f-safe"> בלי סימני סיכון גבוה</label>
      <label><input type="checkbox" id="f-official"> רשמיים בלבד (Anthropic)</label>
      <label><input type="checkbox" id="f-group" checked> עד 3 סקילים מכל ריפו</label>
      <span class="count" id="count"></span>
    </div>

    <section id="list" class="grid" aria-live="polite"></section>
    <div class="more-wrap"><button class="btn" id="more" hidden>עוד תוצאות</button></div>
  </main>

  <footer class="wrap foot">
    <p>הנתונים נאספים אוטומטית פעם ביום מגיטהאב, מרשימות awesome, מ-Hacker News ומהגשות ידניות.
      סימני הסיכון הם בדיקה סטטית של SKILL.md ושל רשימת הקבצים שבתיקייה. הם לא אישור שהסקיל בטוח. כדאי לקרוא את הקוד לפני התקנה.</p>
  </footer>

  <template id="card-tpl">
    <article class="card">
      <div class="card-head">
        <h3 class="name" dir="ltr"></h3>
        <span class="risk"></span>
      </div>
      <a class="repo" dir="ltr" target="_blank" rel="noopener"></a>
      <p class="desc" dir="auto"></p>
      <div class="tags"></div>
      <div class="card-foot">
        <span class="meta"></span>
        <div class="actions">
          <button class="btn small copy" type="button">העתקת התקנה</button>
          <a class="btn small primary open" target="_blank" rel="noopener">פתיחה</a>
        </div>
      </div>
    </article>
  </template>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
